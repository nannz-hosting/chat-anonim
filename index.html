<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Nannz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    :root {
      --primary: #58a6ff;
      --text: #c9d1d9;
      --muted: #8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      padding: 2rem;
      overflow: hidden;
    }

    /* Canvas bintang */
    #stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      background: radial-gradient(ellipse at bottom, #0d1117 0%, #000 100%);
    }

    .card {
      background: rgba(22,27,34,.85);
      border: 1px solid #30363d;
      border-radius: 14px;
      width: 100%;
      max-width: 420px;
      padding: 2rem;
      box-shadow: 0 8px 25px rgba(0,0,0,.6),
                  0 0 20px rgba(88,166,255,.2);
      backdrop-filter: blur(6px);
      transition: transform .3s ease, box-shadow .3s ease;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp .8s ease forwards;
    }
    .card:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 0 25px rgba(88,166,255,.5);
    }
    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .card h1 {
      font-size: 1.6rem;
      text-align: center;
      margin-bottom: 1rem;
      background: linear-gradient(90deg, #58a6ff, #8b5cf6, #00f7ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% auto;
      animation: textShine 6s linear infinite;
    }
    @keyframes textShine {
      to { background-position: 200% center; }
    }

    .card p {
      font-size: .9rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 1.5rem;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: none;
      background: rgba(13,17,23,.8);
      color: var(--text);
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: .75rem;
      font-size: 1rem;
      transition: all .2s ease;
    }
    textarea:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 8px rgba(88,166,255,.6);
    }

    /* Photo upload section */
    .upload-section {
      margin-top: 1rem;
    }

    .upload-area {
      border: 2px dashed #30363d;
      border-radius: 8px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all .3s ease;
      background: rgba(13,17,23,.5);
    }
    .upload-area:hover, .upload-area.dragover {
      border-color: var(--primary);
      background: rgba(88,166,255,.1);
    }

    .upload-area i {
      font-size: 2rem;
      color: var(--muted);
      margin-bottom: .5rem;
      transition: color .3s ease;
    }
    .upload-area:hover i {
      color: var(--primary);
    }

    .upload-text {
      color: var(--muted);
      font-size: .9rem;
    }

    #photoInput {
      display: none;
    }

    /* Preview image */
    .image-preview {
      margin-top: 1rem;
      position: relative;
    }
    .preview-img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #30363d;
    }
    .remove-image {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255,59,48,.9);
      color: white;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      cursor: pointer;
      font-size: .8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s;
    }
    .remove-image:hover {
      background: rgba(255,59,48,1);
    }

    button {
      margin-top: 1rem;
      width: 100%;
      padding: .75rem;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(90deg, #58a6ff, #8b5cf6, #00f7ff);
      background-size: 300% 300%;
      animation: gradientShift 6s ease infinite;
      box-shadow: 0 0 14px rgba(88,166,255,.5);
      transition: transform .2s, box-shadow .2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(139,92,246,.7);
    }
    button:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      margin-top: 1.8rem;
    }
    .socials a {
      font-size: 1.6rem;
      color: var(--muted);
      transition: transform .3s, text-shadow .3s, color .3s;
    }
    .socials a:hover {
      transform: scale(1.3) rotate(5deg);
      text-shadow: 0 0 15px currentColor;
    }
    .wa:hover { color: #25d366; }
    .ig:hover { color: #e1306c; }
    .x:hover { color: #fff; }
    .tele:hover { color: #229ED9; }
    .tt:hover { color: #ff0050; }

    footer {
      margin-top: 2rem;
      font-size: .85rem;
      color: var(--muted);
      text-align: center;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Canvas untuk bintang -->
  <canvas id="stars"></canvas>

  <div class="card">
    <h1>Kirim Pesan Rahasia</h1>
    <p>Pesan kamu akan langsung masuk ke Nando secara anonim. Note : Jika mau kirim foto pakai mode situs desktop</p>
    
    <textarea id="message" placeholder="Tulis pesanmu di sini..."></textarea>
    
    <div class="upload-section">
      <div class="upload-area" id="uploadArea">
        <i class="fas fa-cloud-upload-alt"></i>
        <div class="upload-text">
          Klik atau drag & drop foto di sini<br>
          <small>(JPG, PNG, GIF - Max 10MB)</small>
        </div>
      </div>
      <input type="file" id="photoInput" accept="image/*">
      
      <div id="imagePreview" class="image-preview hidden">
        <img id="previewImg" class="preview-img" src="" alt="Preview">
        <button type="button" class="remove-image" id="removeImage">×</button>
      </div>
    </div>
    
    <button id="sendBtn">✈️ Kirim</button>

    <div class="socials">
      <a href="https://t.me/NANNZ_AJA" target="_blank" class="tele"><i class="fab fa-telegram"></i></a>
    </div>
  </div>

  <footer>© 2025 Nannz</footer>

  <script>
    const BOT_TOKEN = '8259911242:AAHjcoKzatC_oAcWFsjx5wUiHuSq8x1adJM';
    const CHAT_ID   = '7770693795';

    const messageEl = document.getElementById('message');
    const sendBtn   = document.getElementById('sendBtn');
    const uploadArea = document.getElementById('uploadArea');
    const photoInput = document.getElementById('photoInput');
    const imagePreview = document.getElementById('imagePreview');
    const previewImg = document.getElementById('previewImg');
    const removeImage = document.getElementById('removeImage');

    let selectedFile = null;

    // Upload area click handler
    uploadArea.onclick = () => photoInput.click();

    // File input change handler
    photoInput.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        handleFileSelect(file);
      }
    };

    // Drag and drop handlers
    uploadArea.ondragover = (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    };

    uploadArea.ondragleave = () => {
      uploadArea.classList.remove('dragover');
    };

    uploadArea.ondrop = (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        handleFileSelect(file);
      }
    };

    // Remove image handler
    removeImage.onclick = () => {
      selectedFile = null;
      imagePreview.classList.add('hidden');
      photoInput.value = '';
    };

    function handleFileSelect(file) {
      // Check file size (10MB limit)
      if (file.size > 10 * 1024 * 1024) {
        alert('File terlalu besar! Maksimal 10MB.');
        return;
      }

      // Check file type
      if (!file.type.startsWith('image/')) {
        alert('File harus berupa gambar (JPG, PNG, GIF).');
        return;
      }

      selectedFile = file;
      
      // Show preview
      const reader = new FileReader();
      reader.onload = (e) => {
        previewImg.src = e.target.result;
        imagePreview.classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    sendBtn.onclick = async () => {
      const text = messageEl.value.trim();
      
      if (!text && !selectedFile) {
        alert('Pesan atau foto tidak boleh kosong!');
        return;
      }

      sendBtn.disabled = true;
      sendBtn.textContent = 'Mengirim...';

      try {
        if (selectedFile) {
          await sendPhoto(text);
        } else {
          await sendMessage(text);
        }
        
        alert('Pesan terkirim! ✔️');
        messageEl.value = '';
        selectedFile = null;
        imagePreview.classList.add('hidden');
        photoInput.value = '';
      } catch (e) {
        console.error('Error:', e);
        alert('Gagal mengirim, coba lagi.');
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = '✈️ Kirim';
      }
    };

    async function sendMessage(text) {
      const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
      const body = new URLSearchParams({
        chat_id: CHAT_ID,
        text: `💌 Ada Pesan Sayang❤:\n\n${text}`
      });

      await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body
      });
    }

    async function sendPhoto(caption) {
      // Convert image to base64 and send via URL
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = async function(e) {
          try {
            const base64Data = e.target.result.split(',')[1];
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
            
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            
            // Create a new blob from base64 data
            const byteCharacters = atob(base64Data);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
              byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], { type: selectedFile.type });
            
            formData.append('photo', blob, selectedFile.name);
            formData.append('caption', `📸 Foto anonim baru:\n\n${caption || 'Tidak ada pesan'}`);

            const response = await fetch(url, {
              method: 'POST',
              body: formData
            });
            
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            resolve();
          } catch (error) {
            reject(error);
          }
        };
        reader.onerror = () => reject(new Error('Failed to read file'));
        reader.readAsDataURL(selectedFile);
      });
    }

    // 🌌 Animasi Bintang
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      stars = [];
      for (let i = 0; i < 120; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.5,
          speed: Math.random() * 1.2 + 0.5
        });
      }
    }

    function animateStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fff";
      stars.forEach(star => {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fill();
        star.y += star.speed;
        if (star.y > canvas.height) {
          star.y = 0;
          star.x = Math.random() * canvas.width;
        }
      });
      requestAnimationFrame(animateStars);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    animateStars();
  </script>
</body>
</html>
